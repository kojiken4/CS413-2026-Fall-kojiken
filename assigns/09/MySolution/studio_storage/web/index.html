<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAMBDA-studio</title>
  <link rel="stylesheet" href="/studio/styles.css">
  <script type="module" src="/studio/programs.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-width">
      <h1>LAMBDA-studio</h1>
      <p>Saved data is cleared when the storage service stops.</p>
    </div>
  </header>
  <main class="site-width workspace">
    <aside class="panel library" aria-labelledby="program-list-heading">
      <h2 id="program-list-heading">Saved programs</h2>
      <div class="actions library-actions">
        <button id="new-program" type="button">New program</button>
        <button id="refresh-programs" class="secondary" type="button">Refresh list</button>
      </div>
      <p id="program-list-status" class="muted" role="status">Loading saved programs…</p>
      <ul id="program-list" class="program-list"></ul>
    </aside>

    <section class="panel editor" aria-labelledby="program-editor-heading">
      <header class="editor-heading">
        <h2 id="program-editor-heading">Program editor</h2>
        <p id="save-status" class="save-status" role="status">New program</p>
      </header>
      <p id="program-error" class="notice error" role="alert" hidden></p>
      <div id="program-conflict" class="notice" hidden>
        <p role="alert">A newer version is saved on the server. Reloading replaces this draft.</p>
        <button id="reload-program" class="secondary" type="button">Reload server copy</button>
      </div>
      <form id="program-form">
        <fieldset id="program-fields">
          <label for="program-name">Name</label>
          <input id="program-name" name="name" type="text" required>

          <label for="program-description">Description <span class="muted">(optional)</span></label>
          <textarea id="program-description" name="description" rows="2"></textarea>

          <label for="program-source">LAMBDA source</label>
          <textarea id="program-source" class="source" name="source" rows="12" spellcheck="false" required></textarea>

          <div class="actions">
            <button id="save-program" type="submit">Save program</button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>
</body>
</html>
